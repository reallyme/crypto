[package]
name = "reallyme-crypto-poseidon2"
version = "0.4.1"
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
publish = true
description = "BN254 Poseidon2 byte hashing compatible with ReallyMe ZK circuits."
license.workspace = true
repository.workspace = true

[lib]
name = "crypto_poseidon2"

[features]
default = []
proto = ["dep:crypto-proto"]
native = []
wasm = ["dep:getrandom02"]

[dependencies]
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.1", path = "../proto", optional = true, default-features = false, features = ["generated"] }
crypto-core = { package = "reallyme-crypto-core", version = "=0.4.1", path = "../crypto/core", default-features = false }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
taceo-poseidon2 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Arkworks 0.6 retains rand_core 0.6 and getrandom 0.2. Select its JS entropy
# backend here so this crate's standalone wasm build does not depend on a facade.
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"], optional = true }

[package.metadata.cargo-machete]
# Enables the transitive arkworks entropy backend through feature unification.
ignored = ["getrandom02"]

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
buffa = { workspace = true }
hex-literal = { workspace = true }

[lints]
workspace = true
