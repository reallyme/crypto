[package]
name = "reallyme-crypto-hkdf"
version = "0.4.1"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
publish = true
description = "HKDF key derivation primitive for ReallyMe Crypto."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = [
    # Enables getrandom's wasm entropy backend for the transitive digest stack.
    "getrandom",
    # Enables zeroization for the fixed-size SHA-384 PRK returned by `hkdf`.
    "hybrid-array",
]

[lib]
name = "crypto_hkdf"

[features]
# Metadata conversion does not select an execution backend.
proto = ["dep:crypto-proto", "dep:buffa"]
default = []
native = []
wasm = ["dep:getrandom"]
sha3 = ["dep:sha3"]

[dependencies]
buffa = { workspace = true, optional = true }
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.1", path = "../proto", optional = true, default-features = false, features = ["generated"] }
crypto-core = { package = "reallyme-crypto-core", version = "=0.4.1", path = "../crypto/core" }
getrandom = { workspace = true, features = ["wasm_js"], optional = true }
hkdf = { workspace = true }
hybrid-array = { workspace = true, features = ["zeroize"] }
sha2 = { workspace = true }
sha3 = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
buffa = { workspace = true }
wasm-bindgen-test = { workspace = true }
hex-literal = { workspace = true }

[lints]
workspace = true
