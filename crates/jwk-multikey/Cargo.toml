[package]
name = "reallyme-crypto-jwk-multikey"
version = "0.4.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "JWK and Multikey public-key envelope conversion for ReallyMe Crypto."

[lib]
name = "envelopes_jwk_multikey"

[features]
default = ["native"]
proto = ["dep:buffa", "dep:crypto-proto", "envelopes-jwk/proto", "zeroize/derive"]

native = ["envelopes-jwk/native"]

wasm = ["envelopes-jwk/wasm"]

[dependencies]
buffa = { workspace = true, optional = true }
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.0", path = "../proto", optional = true, default-features = false, features = ["generated"] }
zeroize = { workspace = true }
crypto-core = { package = "reallyme-crypto-core", version = "=0.4.0", path = "../crypto/core", default-features = false }

# multikey codec (decode / encode)
codec-multikey = { package = "reallyme-codec-multikey", version = "0.3.4" }

# JWK envelope
envelopes-jwk = { package = "reallyme-crypto-jwk", version = "=0.4.0", path = "../jwk", default-features = false }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
serde_json = { workspace = true }
codec-base64url = { package = "reallyme-codec-base64url", version = "0.3.4" }
crypto-dispatch = { package = "reallyme-crypto-dispatch", version = "=0.4.0", path = "../crypto/dispatch", default-features = false, features = ["native", "p256"] }

[lints]
workspace = true
