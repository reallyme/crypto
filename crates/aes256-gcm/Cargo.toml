[package]
name = "reallyme-crypto-aes256-gcm"
version = "0.3.13"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "AES-256-GCM authenticated encryption primitive for ReallyMe Crypto."

[package.metadata.cargo-machete]
ignored = [
    # Enables AES round-key zeroization for standalone consumers.
    "aes",
    # The transitive RustCrypto stack requires browser entropy on wasm32.
    "getrandom",
]

[lib]
name = "crypto_aes256_gcm"

[features]
default = []

native = [
    "dep:aes",
    "dep:aes-gcm",
]

wasm = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:getrandom",
]

[dependencies]
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.13", path = "../crypto/core" }
zeroize = { workspace = true, features = ["zeroize_derive"] }

# Package-owned Rust implementation dependencies for both backend lanes.
aes = { workspace = true, features = ["zeroize"], optional = true }
aes-gcm = { workspace = true, optional = true }
getrandom = { workspace = true, features = ["wasm_js"], optional = true }

[dev-dependencies]
hex = { workspace = true }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aes-gcm = { workspace = true }

[lints]
workspace = true
