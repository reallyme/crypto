[package]
name = "reallyme-crypto-csprng"
version = "0.4.1"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
publish = true
description = "Cryptographically secure random byte generation for ReallyMe Crypto."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = [
    # Enables getrandom's wasm JS entropy backend for wasm32-unknown-unknown.
    "getrandom",
]

[lib]
name = "crypto_csprng"

[features]
default = []
proto = ["dep:crypto-proto", "crypto-core/protobuf"]
native = []
wasm = ["getrandom/wasm_js"]

[dependencies]
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.1", path = "../proto", optional = true, default-features = false, features = ["generated"] }
crypto-core = { package = "reallyme-crypto-core", version = "=0.4.1", path = "../crypto/core" }
getrandom = { workspace = true, features = ["sys_rng"] }
secrecy = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
wasm-bindgen-test = { workspace = true }
buffa = { workspace = true }

[lints]
workspace = true
