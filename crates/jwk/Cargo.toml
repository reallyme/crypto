[package]
name = "reallyme-crypto-jwk"
version = "0.4.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "JWK envelope encoding and canonicalization for ReallyMe Crypto keys."

[lib]
name = "envelopes_jwk"

[features]
default = ["native"]
proto = ["dep:buffa", "dep:crypto-proto", "dep:zeroize"]

native = [
    "crypto-p256/native",
    "crypto-secp256k1/native",
]

wasm = [
    "crypto-p256/wasm",
    "crypto-secp256k1/wasm",
]

[dependencies]
buffa = { workspace = true, optional = true }
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.0", path = "../proto", default-features = false, features = ["generated"], optional = true }
zeroize = { workspace = true, optional = true }
crypto-core = { package = "reallyme-crypto-core", version = "=0.4.0", path = "../crypto/core", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

codec-base64url = { package = "reallyme-codec-base64url", version = "0.3.4" }
codec-jcs = { package = "reallyme-codec-jcs", version = "0.3.4" }
crypto-p256 = { package = "reallyme-crypto-p256", version = "=0.4.0", path = "../p256", default-features = false }
crypto-ed25519 = { package = "reallyme-crypto-ed25519", version = "=0.4.0", path = "../ed25519", default-features = false }
crypto-secp256k1 = { package = "reallyme-crypto-secp256k1", version = "=0.4.0", path = "../secp256k1", default-features = false }


[lints]
workspace = true
