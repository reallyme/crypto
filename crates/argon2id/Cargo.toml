[package]
name = "reallyme-crypto-argon2id"
version = "0.4.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
publish = true
description = "Argon2id password hashing and key derivation primitive for ReallyMe Crypto."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = [
    # Enables getrandom's wasm entropy backend for the transitive password-hash stack.
    "getrandom",
]

[lib]
name = "crypto_argon2id"

[features]
# Metadata conversion does not select an execution backend.
proto = ["dep:crypto-proto", "dep:buffa"]
default = ["native"]
native = []
wasm = ["dep:getrandom"]

[dependencies]
buffa = { workspace = true, optional = true }
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.0", path = "../proto", optional = true, default-features = false, features = ["generated"] }
crypto-core = { package = "reallyme-crypto-core", version = "=0.4.0", path = "../crypto/core" }
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
getrandom = { workspace = true, features = ["wasm_js"], optional = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
buffa = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
