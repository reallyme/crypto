[package]
name = "reallyme-crypto-proto"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "ReallyMe crypto protobuf identifiers generated with Buffa."
include = ["/proto/**/*.proto", "/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = []
contract-types = []
error-types = ["dep:thiserror"]
generated = ["error-types", "contract-types", "dep:buffa", "buffa/json", "dep:base64", "dep:serde", "dep:serde_json", "dep:subtle", "dep:zeroize"]

[dependencies]
base64 = { workspace = true, optional = true }
buffa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[lints]
workspace = true
