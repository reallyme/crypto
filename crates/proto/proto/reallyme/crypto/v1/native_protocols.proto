syntax = "proto3";

package reallyme.crypto.v1;

option java_multiple_files = true;
option java_package = "me.really.crypto.v1";
option swift_prefix = "ReallyMeProto";

// Build-relative component availability. Executable implementations occupy
// 100-199 and registered but unavailable identities occupy 200-299. Zero does
// not authorize execution; a complete suite still requires native validation.
enum HpkeComponentSupport {
  HPKE_COMPONENT_SUPPORT_UNSPECIFIED = 0;
  HPKE_COMPONENT_SUPPORT_EXECUTABLE = 100;
  HPKE_COMPONENT_SUPPORT_REGISTERED_UNAVAILABLE = 200;
}
