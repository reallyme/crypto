[package]
name = "reallyme-crypto-sha3"
version = "0.4.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
publish = true
description = "SHA-3 digest primitives for ReallyMe Crypto."
license.workspace = true
repository.workspace = true

[lib]
name = "crypto_sha3"

[features]
# Standalone schema adapters do not select a cryptographic runtime/backend.
proto = ["crypto-proto/generated"]
default = []
native = []
wasm = []

[dependencies]
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.0", path = "../proto", default-features = false, features = ["contract-types"] }
sha3 = { workspace = true }
shake = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
buffa = { workspace = true }
wasm-bindgen-test = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
