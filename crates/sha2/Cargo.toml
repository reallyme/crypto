[package]
name = "reallyme-crypto-sha2"
version = "0.4.1"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
publish = true
description = "SHA-2 digest primitives for ReallyMe Crypto."
license.workspace = true
repository.workspace = true

[lib]
name = "crypto_sha2"

[features]
default = []
native = []
wasm = []

[dependencies]
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.1", path = "../proto", default-features = false, features = ["contract-types"] }
sha2 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
