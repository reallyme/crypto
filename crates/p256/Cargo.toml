[package]
name = "reallyme-crypto-p256"
version = "0.3.17"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "P-256 ECDSA and ECDH primitives for ReallyMe Crypto."

[lib]
name = "crypto_p256"

[features]
default = []

native = [
    "dep:p256",
    "p256/ecdh",
    "p256/ecdsa",
    "p256/getrandom",
    "p256/pkcs8",
    "p256/std",
    "dep:codec-pem",
    "dep:ecdsa",
    "dep:sha2",
]

wasm = [
    "dep:getrandom",
    "dep:p256",
    "p256/ecdh",
    "p256/ecdsa",
    "p256/getrandom",
    "p256/std",
    "dep:ecdsa",
    "dep:sha2",
]

[dependencies]
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.17", path = "../crypto/core" }
codec-der = { package = "reallyme-codec", version = "=0.3.4", default-features = false, features = ["der"] }
codec-pem = { package = "reallyme-codec-pem", version = "0.3.4", optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

# -----------------------------
# Native-only crypto deps
# -----------------------------
# NOTE: p256 0.14 has no `zeroize` cargo feature; zeroization support is
# unconditional in elliptic-curve 0.14 (SecretKey zeroizes on drop).
p256 = { workspace = true, default-features = false, optional = true }
ecdsa = { workspace = true, features = ["der"], optional = true }
getrandom = { workspace = true, features = ["wasm_js"], optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
# Exercise strict DER even when another consumer enables BER on the same parser.
der-core = { package = "der", version = "=0.8.3", default-features = false, features = ["ber"] }
hex = { workspace = true }
hex-literal = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
