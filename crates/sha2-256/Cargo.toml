[package]
name = "reallyme-crypto-sha2-256"
version = "0.4.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "SHA-256 digest primitive for ReallyMe Crypto."

[package.metadata.cargo-machete]
ignored = [
    # Enables getrandom's wasm entropy backend for the transitive digest stack.
    "getrandom",
]

[lib]
name = "crypto_sha2_256"

[features]
default = []
native = []
wasm = ["dep:getrandom"]

[dependencies]
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.0", path = "../proto", default-features = false, features = ["contract-types"] }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
sha2 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
