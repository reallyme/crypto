[package]
name = "reallyme-crypto-core"
version = "0.4.0"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Shared typed errors and algorithm identifiers for ReallyMe Crypto."


[lib]
name = "crypto_core"

[features]
default = []
protobuf = ["crypto-proto/generated", "dep:buffa"]

[dependencies]
crypto-proto = { package = "reallyme-crypto-proto", version = "=0.4.0", path = "../../proto", default-features = false, features = ["contract-types", "error-types"] }
buffa = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
