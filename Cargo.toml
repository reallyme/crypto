[workspace]
resolver = "2"
default-members = ["crates/crypto"]
members = [
    "crates/crypto",
    "crates/crypto/core",
    "crates/crypto/dispatch",
    "crates/ffi",
    "crates/crypto/signer",
    "crates/wasm",
    "crates/aes-kw",
    "crates/aes256-gcm",
    "crates/aes256-gcm-siv",
    "crates/argon2id",
    "crates/chacha20-poly1305",
    "crates/concat-kdf",
    "crates/constant-time",
    "crates/csprng",
    "crates/ed25519",
    "crates/hmac",
    "crates/hkdf",
    "crates/kmac",
    "crates/ml-dsa-44",
    "crates/ml-dsa-65",
    "crates/ml-dsa-87",
    "crates/ml-kem-512",
    "crates/ml-kem-1024",
    "crates/ml-kem-768",
    "crates/p256",
    "crates/p384",
    "crates/p521",
    "crates/pbkdf2",
    "crates/poseidon2",
    "crates/rsa",
    "crates/secp256k1",
    "crates/sha2",
    "crates/sha2-256",
    "crates/sha3",
    "crates/sha3-256",
    "crates/slh-dsa",
    "crates/x25519",
    "crates/x448",
    "crates/x-wing",
    "crates/hpke",
    "crates/jwk",
    "crates/jwk-multikey",
    "crates/conformance",
    "crates/proto",
    "tools/external-vector-audit",
    "tools/optional-provider-build",
]
exclude = ["core", "fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/crypto"
publish = false

# Centralized external (crates.io) dependency versions.
#
# Every member crate inherits these via `dep = { workspace = true }` so that a
# single audited version requirement governs the whole workspace. Crate-specific
# `features`, `default-features`, and `optional` are declared at the use site.
#
# Deliberately NOT centralized (genuinely divergent versions across crates):
#   - getrandom (0.2 for the RustCrypto stack, 0.4 for the digest wasm lanes)
# The `*-conformance` package aliases are intentionally left inline to preserve
# their `package = "..."` renames.
[workspace.dependencies]
# Error handling
thiserror = "2.0.21"
# Memory hygiene / secrets
zeroize = "1.9.1"
secrecy = "0.10.3"
subtle = "2.6.1"
# Randomness
getrandom = "0.4.3"
# Hashing / KDF
hybrid-array = "0.4.15"
sha2 = { version = "0.11.1", features = ["zeroize"] }
sha3 = { version = "0.12", features = ["zeroize"] }
# This release still uses digest 0.10 and crypto-common 0.1.7, which pins
# generic-array to 0.14.7. Upgrade that stack when sha3-kmac supports it.
sha3-kmac = { version = "0.3.0", default-features = false }
shake = { version = "0.1", default-features = false, features = ["zeroize"] }
sha1 = "0.11"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
pbkdf2 = "0.13"
argon2 = { version = "0.6", default-features = false }
hpke = { version = "0.15.1", default-features = false }
# AEAD
aes = "0.9.4"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
aes-gcm-siv = { version = "0.12.1", features = ["zeroize"] }
polyval = { version = "0.7.3", features = ["zeroize"] }
poly1305 = { version = "0.9.1", features = ["zeroize"] }
aes-kw = { version = "0.3.1", default-features = false }
chacha20poly1305 = "0.11"
# Signatures / key agreement
ed25519-dalek = "3"
curve25519-dalek = "5"
x25519-dalek = "3"
# These Curve448 releases remain prereleases upstream. Keep the current reviewed
# versions until newer releases are available; older stable releases would be a
# downgrade and would split the shared elliptic-curve dependency stack.
x448 = { version = "=0.14.0-pre.12", default-features = false }
p256 = { version = "0.14", default-features = false }
p384 = "0.14"
p521 = "0.14"
k256 = "0.14"
ecdsa = "0.17"
elliptic-curve = { version = "0.14.3", features = ["arithmetic", "ecdh"] }
primefield = "0.14"
primeorder = "0.14"
bp256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
bp384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "sha384"] }
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false }
# Only explicitly selected native Brainpool/Ed448 providers use this dependency.
openssl = { version = "0.10.82", default-features = false }
openssl-src = "=400.0.2"
crypto-bigint = { version = "0.7.11", features = ["alloc"] }
const-oid = { version = "0.10.3", features = ["db"] }
ark-bn254 = "0.6"
ark-ff = "0.6"
taceo-poseidon2 = { version = "=0.3.1", default-features = false, features = ["bn254", "t4"] }
spki = "0.8.1"
# Post-quantum
ml-dsa = { version = "0.1.2", default-features = false }
ml-kem = "0.3.4"
# No stable 0.2 release is published yet; retain the existing release candidate.
slh-dsa = "=0.2.0-rc.5"
# Encoding / serialization
buffa = { package = "reallyme-buffa", version = "=0.1.2", default-features = false }
base64 = "0.23.1"
serde = "1.0.229"
serde_json = "1.0.154"
# WASM bridge
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
# Dev / test
hex = "0.4.3"
hex-literal = "1.1"
# Upstream pins minicov to 0.3.8; its 0.3.9 update needs a wasm-bindgen-test release.
wasm-bindgen-test = "0.3.80"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# Native libraries cross C and JNI boundaries whose panic firewall requires
# unwinding. Release packaging must select this profile explicitly; keeping the
# policy in Cargo avoids relying on RUSTFLAGS/codegen-option precedence.
[profile.release-ffi]
inherits = "release"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
large_include_file = "deny"
