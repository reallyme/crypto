version: v2
# Compile policy metadata for maintenance generation without exposing its
# descriptor-option model as a runtime SDK API.
inputs:
  - directory: .
    exclude_types:
      - reallyme.crypto.contract.v1.**
plugins:
  # Rust Buffa message/view types. This mirrors the platform workspace
  # contract-generation convention and intentionally avoids build.rs codegen.
  - local: protoc-gen-reallyme-buffa
    out: crates/proto/src/generated/buffa
    strategy: all
    opt:
      - views=true
      - json=true
      - zeroize_in=.reallyme.crypto.v1
      - unknown_fields=false
      - deny_unknown_json_fields=true
      - bytes_type_custom_in=.reallyme.crypto.v1=crate::SecretBytes
      - bytes_type_custom_in=.reallyme.crypto.v1.CryptoKeyPair.secret_key=crate::PrivateBytes
      - string_type_custom_in=.reallyme.crypto.v1=crate::SecretString
      - json_policy_type=crate::SecretBytes
      - json_policy_type=crate::PrivateBytes
      - json_policy_type=crate::SecretString
      - extern_path=.reallyme.crypto.v1.P256KeyContainerFormat=crate::enum_contracts::P256KeyContainerFormat
      - extern_path=.reallyme.crypto.v1.PublicKeyFormatOperation=crate::enum_contracts::PublicKeyFormatOperation
      - extern_path=.reallyme.crypto.v1.Argon2PlatformClass=crate::enum_contracts::Argon2PlatformClass
      - extern_path=.reallyme.crypto.v1.HkdfDomainKeyPurpose=crate::enum_contracts::HkdfDomainKeyPurpose
      - extern_path=.reallyme.crypto.v1.EcdsaEncoding=crate::enum_contracts::EcdsaEncoding
      - extern_path=.reallyme.crypto.v1.Ed448Operation=crate::enum_contracts::Ed448Operation
      - extern_path=.reallyme.crypto.v1.NativeKeySource=crate::enum_contracts::NativeKeySource
      - extern_path=.reallyme.crypto.v1.HpkeComponentSupport=crate::enum_contracts::HpkeComponentSupport
      - extern_path=.reallyme.crypto.v1.ProviderOperation=crate::enum_contracts::ProviderOperation
      - extern_path=.reallyme.crypto.v1.ProviderKind=crate::enum_contracts::ProviderKind
      - extern_path=.reallyme.crypto.v1.ProviderLane=crate::enum_contracts::ProviderLane
      - extern_path=.reallyme.crypto.v1.KeyResidency=crate::enum_contracts::KeyResidency
      - extern_path=.reallyme.crypto.v1.KeyCopyBoundary=crate::enum_contracts::KeyCopyBoundary
      - extern_path=.reallyme.crypto.v1.ProviderOutputPolicy=crate::enum_contracts::ProviderOutputPolicy
      - extern_path=.reallyme.crypto.v1.ProviderPolicyReason=crate::enum_contracts::ProviderPolicyReason
      - extern_path=.reallyme.crypto.v1.ProviderDisposition=crate::enum_contracts::ProviderDisposition
      - extern_path=.reallyme.crypto.v1.FallbackPolicy=crate::enum_contracts::FallbackPolicy
