  - local: protoc-gen-reallyme-buffa-packaging
    out: crates/proto/src/generated/buffa
    strategy: all
  # TypeScript
  - remote: buf.build/bufbuild/es:v2.14.1
    out: gen/es
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/bufbuild/es:v2.14.1
    out: packages/ts/src/proto/generated
    opt:
      - target=ts
      - import_extension=js

  # JavaScript runtime
  - remote: buf.build/bufbuild/es:v2.14.1
    out: gen/es
    opt:
      - target=js
      - import_extension=js

  # Swift
  - remote: buf.build/apple/swift:v1.38.1
    out: gen/swift
    opt:
      - Visibility=Public

  # Java core message classes used by Kotlin.
  - remote: buf.build/protocolbuffers/java:v36.2
    out: gen/java
    opt:
      - lite

  # Kotlin DSL/extensions.
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: gen/kotlin
    opt:
      - lite
