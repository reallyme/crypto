version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /packages/ts
      - /crates/conformance
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directories:
      - /packages/kotlin
      - /packages/kotlin-android
      - /crates/conformance/platform/kotlin
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directories:
      - /
      - /crates/conformance/platform/swift
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
