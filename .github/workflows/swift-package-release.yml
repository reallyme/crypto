name: Swift Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from the successful package preflight
        required: true
        type: string
      source_sha:
        description: Copy the full source SHA from this ecosystem's successful package preflight summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swift-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select source from main history
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 5f30357e5c5e1cf757be793a45149c455730bdca
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # Node 26
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release swift publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}

  swift-verify:
    name: SwiftPM artifact verification
    needs: verify-release-sha
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: build/swift

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Bind manifest to attested Swift artifact
        run: |
          checksum="$(cat build/swift/ReallyMeCryptoFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify SwiftPM manifest and downloaded artifact
        run: node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeCryptoFFI.xcframework.zip build/swift/ReallyMeCryptoFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

  swift-release:
    name: SwiftPM release tag
    needs: [verify-release-sha, swift-verify]
    runs-on: macos-26
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job alone pushes the checksum-bound release tag.
          persist-credentials: true
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          fetch-depth: 0

      - name: Download verified Swift artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: build/swift

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Bind release manifest to verified Swift artifact
        run: |
          checksum="$(cat build/swift/ReallyMeCryptoFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Create immutable GitHub release with Swift artifact
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeCryptoFFI.xcframework.zip build/swift/ReallyMeCryptoFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          node scripts/extract_release_notes.mjs "${RELEASE_VERSION}" > "${RUNNER_TEMP}/release-notes.md"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::GitHub release v${RELEASE_VERSION} already exists"
            exit 1
          fi
          if ! git diff --quiet -- . ':(exclude)Package.swift'; then
            echo "::error::Swift release preparation modified files other than Package.swift"
            exit 1
          fi
          tag_target="${RELEASE_SHA}"
          if ! git diff --quiet -- Package.swift; then
            release_committer_name="$(git show -s --format=%cn "${RELEASE_SHA}")"
            release_committer_email="$(git show -s --format=%ce "${RELEASE_SHA}")"
            if [ -z "${release_committer_name}" ] || [ -z "${release_committer_email}" ]; then
              echo "::error::release source commit has no committer identity"
              exit 1
            fi
            git add Package.swift
            release_commit_date="$(git show -s --format=%cI "${RELEASE_SHA}")"
            GIT_AUTHOR_NAME="${release_committer_name}" GIT_AUTHOR_EMAIL="${release_committer_email}" \
              GIT_COMMITTER_NAME="${release_committer_name}" GIT_COMMITTER_EMAIL="${release_committer_email}" \
              GIT_AUTHOR_DATE="${release_commit_date}" GIT_COMMITTER_DATE="${release_commit_date}" \
              git commit -m "Bind Swift artifact for v${RELEASE_VERSION}"
            tag_target="$(git rev-parse HEAD)"
          fi
          # Verify the manifest bytes in the commit that will receive the tag,
          # not only the working tree used to prepare that commit.
          git show "${tag_target}:Package.swift" > "${RUNNER_TEMP}/tagged-Package.swift"
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeCryptoFFI.xcframework.zip build/swift/ReallyMeCryptoFFI.xcframework.checksum "${RUNNER_TEMP}/tagged-Package.swift" "${RELEASE_VERSION}"
          existing_tag_target="$(git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}" | cut -f1)"
          if [ -n "${existing_tag_target}" ] && [ "${existing_tag_target}" != "${tag_target}" ]; then
            echo "::error::Git tag v${RELEASE_VERSION} already targets a different commit"
            exit 1
          fi
          if [ -z "${existing_tag_target}" ]; then
            git tag "v${RELEASE_VERSION}" "${tag_target}"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi
          gh release create "v${RELEASE_VERSION}" build/swift/ReallyMeCryptoFFI.xcframework.zip --verify-tag --title "ReallyMe Crypto v${RELEASE_VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
