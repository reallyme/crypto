name: npm Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from preflight, such as 0.4.3
        required: true
        type: string
        default: 0.4.3
      source_sha:
        description: Copy the full source SHA from this ecosystem's successful package preflight summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select source from main history
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this release workflow from main."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter the package version from preflight in the version field. Enter the commit SHA in source_sha."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Enter the full 40-character commit SHA from preflight in source_sha."
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release npm publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}

  publish:
    name: publish npm package
    needs: verify-release-sha
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: build/npm


      - name: Verify npm tarball checksum
        working-directory: build/npm
        run: sha256sum --check "reallyme-crypto-${RELEASE_VERSION}.tgz.sha256"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Reject excluded release files
        run: |
          python3 -B scripts/check_repository_privacy.py --index
          python3 -B scripts/check_release_privacy.py --archive "build/npm/reallyme-crypto-${RELEASE_VERSION}.tgz" --source-root packages/ts --strip-components 1
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Publish verified npm tarball with provenance
        working-directory: build/npm
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::Publishing requires environment-bound OIDC, without a stored npm token"
            exit 1
          fi
          npm publish "reallyme-crypto-${RELEASE_VERSION}.tgz" --provenance --access public --ignore-scripts --registry=https://registry.npmjs.org
        env:
          # Do not inherit a token-bearing user configuration on the runner.
          NPM_CONFIG_USERCONFIG: /dev/null
          RELEASE_VERSION: ${{ inputs.version }}
