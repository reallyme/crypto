name: npm Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from the successful package preflight
        required: true
        type: string
      source_sha:
        description: Copy the full source SHA from this ecosystem's successful package preflight summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select source from main history
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 45b52cf353b0b85694a96c6addc985221274ff37
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # Node 26
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release npm publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}

  publish:
    name: publish npm package
    needs: verify-release-sha
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: build/npm


      - name: Verify npm tarball checksum
        working-directory: build/npm
        run: sha256sum --check "reallyme-crypto-${RELEASE_VERSION}.tgz.sha256"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Publish verified npm tarball with provenance
        working-directory: build/npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required"
            exit 1
          fi
          npm publish "reallyme-crypto-${RELEASE_VERSION}.tgz" --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
