name: Read-only OSV lockfile scan

on:
  workflow_call:
    inputs:
      scan-args:
        description: Lockfiles to scan
        required: true
        type: string
      fail-on-vuln:
        description: Fail when a completed scan finds vulnerabilities
        required: true
        type: boolean
      report-name:
        description: Unique artifact name for this scan lane
        required: true
        type: string
      gradle-tooling-inventory:
        description: Include trusted Gradle plugin and detached tool dependencies
        required: false
        default: false
        type: boolean

# The upstream reusable workflow requests security write access even when
# SARIF uploads are disabled. Use its pinned scanner and reporter directly
# so lockfile scans have no repository mutation permissions.
permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare scan outputs
        shell: bash
        run: |
          set -euo pipefail
          # A checked-in report must never stand in for a failed scan's output.
          rm -f -- results.json results.sarif

      - name: Derive Gradle build tooling scan input
        if: ${{ inputs.gradle-tooling-inventory }}
        run: python3 scripts/verify_gradle_checksum_provenance.py --osv-lockfile build/dependency-security/gradle.lockfile

      - name: Scan lockfiles
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ inputs.scan-args }}
        # A vulnerability finding exits nonzero too. The reporter decides
        # whether findings block this lane, after confirming the scan completed.
        continue-on-error: true

      - name: Require completed scan results
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s results.json ]]; then
            echo "::error::OSV scan did not produce results"
            exit 1
          fi
          jq -e 'type == "object"' results.json >/dev/null

      - name: Report vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Preserve scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}
          path: |
            results.json
            results.sarif
          if-no-files-found: error
          retention-days: 5
