name: Kotlin Android Package Preflight

run-name: Preflight maven ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA for this package preflight
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.4.2

permissions:
  contents: read

concurrency:
  group: kotlin-android-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
    steps:
      - name: Validate preflight dispatch
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_SHA" = "$GITHUB_SHA"

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 55115f21d5bf9a3fbc1bb8d10484aecba6e7bd8f
          path: .release-readiness
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # Node 26
        with:
          node-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Authenticate release-readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Verify dependency security for the candidate
        run: node scripts/verify_release_attestation.mjs --dependency-security
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.source_sha }}

      - name: Verify release candidate
        id: candidate
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release maven preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  jvm-native:
    name: jvm native preflight ${{ matrix.platform }}
    needs: verify-source-sha
    runs-on: ${{ matrix.os }}
    outputs:
      linux_x86_64_sha256: ${{ steps.native-digest.outputs.linux_x86_64_sha256 }}
      linux_aarch64_sha256: ${{ steps.native-digest.outputs.linux_aarch64_sha256 }}
      macos_x86_64_sha256: ${{ steps.native-digest.outputs.macos_x86_64_sha256 }}
      macos_aarch64_sha256: ${{ steps.native-digest.outputs.macos_aarch64_sha256 }}
      windows_x86_64_sha256: ${{ steps.native-digest.outputs.windows_x86_64_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Stage crypto JNI resource
        run: scripts/build_kotlin_native_resource.sh build/kotlin-native-resources
        shell: bash

      - name: Record native library digest outside the artifact
        id: native-digest
        run: node scripts/verify_native_artifact_handoff.mjs record build/kotlin-native-resources "${NATIVE_PLATFORM}"
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}

      - name: Upload crypto JNI resource
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-native-${{ matrix.platform }}
          path: build/kotlin-native-resources
          if-no-files-found: error

  kotlin-package:
    name: kotlin maven preflight
    needs: [verify-source-sha, jvm-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Rust toolchain for release readiness
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download crypto JNI resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-native-*
          path: build/kotlin-native-resources
          merge-multiple: true

      - name: Verify native resources against producer job outputs
        run: node scripts/verify_native_artifact_handoff.mjs verify build/kotlin-native-resources
        env:
          NATIVE_SHA256_LINUX_X86_64: ${{ needs.jvm-native.outputs.linux_x86_64_sha256 }}
          NATIVE_SHA256_LINUX_AARCH64: ${{ needs.jvm-native.outputs.linux_aarch64_sha256 }}
          NATIVE_SHA256_MACOS_X86_64: ${{ needs.jvm-native.outputs.macos_x86_64_sha256 }}
          NATIVE_SHA256_MACOS_AARCH64: ${{ needs.jvm-native.outputs.macos_aarch64_sha256 }}
          NATIVE_SHA256_WINDOWS_X86_64: ${{ needs.jvm-native.outputs.windows_x86_64_sha256 }}

      - name: Write native checksum manifest
        run: node scripts/write_native_manifest.mjs build/kotlin-native-resources/me/really/crypto/native build/kotlin-native-resources/me/really/crypto/native/native-manifest.json

      - name: Check package versions and release policy
        run: node scripts/run_pinned_release_readiness.mjs --release-packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Test and publish to Maven local
        working-directory: packages/kotlin
        run: ./gradlew --dependency-verification strict test publishMavenPublicationToLocalReleaseRepository -Preallyme.crypto.nativeResourcesDir=${{ github.workspace }}/build/kotlin-native-resources -Preallyme.crypto.requireFullNativeResources=true

      - name: Stage versioned JVM publication
        run: node scripts/stage_maven_publications.mjs jvm packages/kotlin/build/repos/releases "$RELEASE_VERSION" "$RUNNER_TEMP/maven-jvm"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-jvm-${{ inputs.version }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/maven-jvm
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ||
                ! "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'After this preflight succeeds, run this command to dispatch publish with both inputs set.' '' \
              '```sh' "gh workflow run kotlin-android-package-release.yml --repo github.com/$GITHUB_REPOSITORY --ref main -f version=$RELEASE_VERSION -f source_sha=$SOURCE_SHA" '```' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi

  android-package:
    name: android aar preflight
    needs: verify-source-sha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install pinned Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "ndk;29.0.14206865" <<< "$(printf 'y\n%.0s' {1..32})"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "${GITHUB_ENV}"

      - name: Stage Android JNI libraries
        run: scripts/build_android_native_resources.sh build/android-jniLibs

      - name: Write Android native checksum manifest
        run: node scripts/write_native_manifest.mjs build/android-jniLibs build/android-native-assets/reallyme-crypto/native-manifest.json

      - name: Build Android AAR
        run: packages/kotlin-android/gradlew --dependency-verification strict -p packages/kotlin-android verifyAndroidJniLibs bundleReleaseAar verifyReleaseAarContainsJniLibs publishAndroidReleasePublicationToLocalReleaseRepository -Preallyme.crypto.androidJniLibsDir=${{ github.workspace }}/build/android-jniLibs -Preallyme.crypto.androidNativeAssetsDir=${{ github.workspace }}/build/android-native-assets -Preallyme.crypto.requireAndroidJniLibs=true

      - name: Stage versioned Android publication
        run: node scripts/stage_maven_publications.mjs android packages/kotlin-android/build/repos/releases "$RELEASE_VERSION" "$RUNNER_TEMP/maven-android"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-android-${{ inputs.version }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/maven-android
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  android-instrumented:
    name: android instrumented preflight api ${{ matrix.api }}
    needs: [verify-source-sha, android-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK packages
        run: |
          { yes 2>/dev/null || true; } | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "platforms;android-${{ matrix.api }}" \
            "emulator" \
            "platform-tools" \
            "ndk;29.0.14206865" \
            "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "${GITHUB_ENV}"

      - name: Download candidate Android publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-android-${{ inputs.version }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/android-package

      - name: Stage JNI libraries from the candidate AAR
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          archive="$RUNNER_TEMP/android-package/me/really/crypto-android/$RELEASE_VERSION/crypto-android-$RELEASE_VERSION.aar"
          extract="$RUNNER_TEMP/android-extract"
          mkdir "$extract"
          (cd "$extract" && jar xf "$archive" jni assets/reallyme-crypto/native-manifest.json)
          mkdir -p build
          mv "$extract/jni" build/android-jniLibs
          mv "$extract/assets" build/android-native-assets

      - name: Create Android virtual device
        env:
          # Pin the AVD directory because avdmanager and emulator otherwise infer
          # it independently from runner-specific home-directory variables.
          ANDROID_AVD_HOME: ${{ runner.temp }}/reallyme-avd-${{ matrix.api }}
        run: |
          set -euo pipefail
          AVD_NAME="reallyme-api-${{ matrix.api }}"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo "no" | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "${AVD_NAME}" \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" \
            --device "pixel"
          if ! "${ANDROID_HOME}/emulator/emulator" -list-avds | grep -Fqx "${AVD_NAME}"; then
            echo "::error::avdmanager did not create the expected Android virtual device"
            exit 1
          fi

      - name: Run Android instrumented tests
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/reallyme-avd-${{ matrix.api }}
        run: |
          set -euo pipefail
          AVD_NAME="reallyme-api-${{ matrix.api }}"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR_LOG="${RUNNER_TEMP}/reallyme-emulator-${{ matrix.api }}.log"
          DEVICE_WAIT_ATTEMPTS=60
          BOOT_WAIT_ATTEMPTS=60
          WAIT_INTERVAL_SECONDS=5

          "${ANDROID_HOME}/emulator/emulator" \
            -avd "${AVD_NAME}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data >"${EMULATOR_LOG}" 2>&1 &
          EMULATOR_PID=$!

          cleanup_emulator() {
            if kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              kill "${EMULATOR_PID}" 2>/dev/null || :
              wait "${EMULATOR_PID}" 2>/dev/null || :
            fi
          }
          trap cleanup_emulator EXIT

          fail_emulator() {
            echo "::error::$1"
            if [[ -f "${EMULATOR_LOG}" ]]; then
              sed -n '1,240p' "${EMULATOR_LOG}"
            fi
            exit 1
          }

          device_ready=false
          for ((attempt = 1; attempt <= DEVICE_WAIT_ATTEMPTS; attempt += 1)); do
            if ! kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              fail_emulator "Android emulator exited before registering with ADB"
            fi
            if "${ADB}" get-state 2>/dev/null | grep -Fqx "device"; then
              device_ready=true
              break
            fi
            sleep "${WAIT_INTERVAL_SECONDS}"
          done
          if [[ "${device_ready}" != "true" ]]; then
            fail_emulator "Android emulator did not register with ADB within 300 seconds"
          fi

          boot_ready=false
          for ((attempt = 1; attempt <= BOOT_WAIT_ATTEMPTS; attempt += 1)); do
            if ! kill -0 "${EMULATOR_PID}" 2>/dev/null; then
              fail_emulator "Android emulator exited before completing boot"
            fi
            boot_completed=""
            if boot_completed="$("${ADB}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" && \
              [[ "${boot_completed}" == "1" ]]; then
              boot_ready=true
              break
            fi
            sleep "${WAIT_INTERVAL_SECONDS}"
          done
          if [[ "${boot_ready}" != "true" ]]; then
            fail_emulator "Android emulator did not complete boot within 300 seconds"
          fi

          "${ADB}" shell input keyevent 82 || true
          packages/kotlin-android/gradlew --dependency-verification strict -p packages/kotlin-android connectedDebugAndroidTest \
            -Preallyme.crypto.androidJniLibsDir=${{ github.workspace }}/build/android-jniLibs \
            -Preallyme.crypto.androidNativeAssetsDir=${{ github.workspace }}/build/android-native-assets \
            -Preallyme.crypto.requireAndroidJniLibs=true
