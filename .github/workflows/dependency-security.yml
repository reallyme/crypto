name: Dependency Security

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  verify-runtime-lockfiles:
    name: Verify published Gradle runtime dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runtime lockfiles match Gradle locks
        run: |
          python3 -m unittest scripts.gradle_runtime_lockfiles_test
          python3 scripts/gradle_runtime_lockfiles.py --check

  verify-gradle-publisher-provenance:
    name: Verify publisher bytes for Gradle checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test checksum verifier
        run: python3 -m unittest scripts.verify_gradle_checksum_provenance_test

      - name: Verify checksum provenance
        run: python3 scripts/verify_gradle_checksum_provenance.py

  scan:
    name: Gate published runtime dependencies
    needs: verify-runtime-lockfiles
    uses: ./.github/workflows/osv-lockfile-scan.yml
    with:
      report-name: runtime-OSV-report
      fail-on-vuln: true
      scan-args: |-
        --lockfile=./Cargo.lock
        --lockfile=./packages/ts/package-lock.json
        --lockfile=./packages/kotlin/runtime/gradle.lockfile
        --lockfile=./packages/kotlin-android/runtime/gradle.lockfile

  scan-build-tooling:
    name: Gate Gradle build tooling advisories
    uses: ./.github/workflows/osv-lockfile-scan.yml
    with:
      report-name: build-tooling-OSV-report
      fail-on-vuln: true
      gradle-tooling-inventory: true
      scan-args: |-
        --lockfile=./packages/kotlin/gradle.lockfile
        --lockfile=./packages/kotlin-android/gradle.lockfile
        --lockfile=./crates/conformance/platform/kotlin/gradle.lockfile
        --lockfile=./packages/kotlin/buildscript-gradle.lockfile
        --lockfile=./packages/kotlin-android/buildscript-gradle.lockfile
        --lockfile=./crates/conformance/platform/kotlin/buildscript-gradle.lockfile
        --lockfile=./build/dependency-security/gradle.lockfile
