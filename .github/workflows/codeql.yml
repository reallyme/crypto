name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: '19 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-24.04
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - language: rust
            os: ubuntu-24.04
            build-mode: none
          - language: java-kotlin
            os: ubuntu-24.04
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            packages/kotlin/gradle.lockfile
            packages/kotlin-android/gradle.lockfile
            crates/conformance/platform/kotlin/gradle.lockfile
            packages/kotlin/gradle/verification-metadata.xml
            packages/kotlin-android/gradle/verification-metadata.xml
            crates/conformance/platform/kotlin/gradle/verification-metadata.xml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build Java and Kotlin for analysis
        if: matrix.language == 'java-kotlin'
        # The independent Gradle roots are not discovered by the automatic
        # builder. Trace the JVM, Android, and conformance source sets explicitly.
        # Android extraction needs compiled JVM sources, not rebuilt JNI artifacts;
        # the Kotlin/native ABI gates validate those artifacts separately.
        run: |
          packages/kotlin/gradlew -p packages/kotlin --dependency-verification strict --no-daemon --no-build-cache --rerun-tasks compileKotlin compileJava
          packages/kotlin-android/gradlew -p packages/kotlin-android --dependency-verification strict --no-daemon --no-build-cache --rerun-tasks compileReleaseKotlin compileReleaseJavaWithJavac -x buildAndroidJniLibs -x generateAndroidNativeManifest -x verifyAndroidJniLibs
          crates/conformance/platform/kotlin/gradlew -p crates/conformance/platform/kotlin --dependency-verification strict --no-daemon --no-build-cache --rerun-tasks compileKotlin

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
