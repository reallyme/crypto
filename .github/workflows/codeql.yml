name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: '19 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: rust
            os: ubuntu-latest
            build-mode: none
          - language: java-kotlin
            os: ubuntu-latest
            build-mode: manual
          - language: swift
            os: macos-26
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Install Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Select Xcode 26.6
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build Java and Kotlin for analysis
        if: matrix.language == 'java-kotlin'
        # The independent Gradle roots are not discovered by the automatic
        # builder. Trace the JVM, Android, and conformance source sets explicitly.
        run: |
          packages/kotlin/gradlew -p packages/kotlin --dependency-verification strict --no-daemon --no-build-cache --rerun-tasks compileKotlin compileJava
          packages/kotlin-android/gradlew -p packages/kotlin-android --dependency-verification strict --no-daemon --no-build-cache --rerun-tasks compileReleaseKotlin compileReleaseJavaWithJavac
          crates/conformance/platform/kotlin/gradlew -p crates/conformance/platform/kotlin --dependency-verification strict --no-daemon --no-build-cache --rerun-tasks compileKotlin

      - name: Build Swift for analysis
        if: matrix.language == 'swift'
        run: |
          touch .reallyme-crypto-runtime-ffi
          REALLYME_CRYPTO_SWIFTPM_RUNTIME_FFI=1 swift build --arch arm64

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
