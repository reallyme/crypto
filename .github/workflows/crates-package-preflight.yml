name: Crates Package Preflight

run-name: Preflight crates ${{ inputs.version }} ${{ inputs.release_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional exact main commit SHA to certify. Leave blank to use current origin/main.
        required: false
        type: string
        default: ""
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.4.1

permissions:
  contents: read

concurrency:
  group: crates-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: verify source SHA
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.resolve-release-sha.outputs.release_sha }}
    steps:
      - name: Checkout main for release SHA resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Resolve release SHA
        id: resolve-release-sha
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          git fetch --no-tags origin main
          if [ -n "${RELEASE_SHA_INPUT}" ]; then
            if [[ ! "${RELEASE_SHA_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release_sha must be blank or a lowercase 40-character commit SHA"
              exit 1
            fi
            release_sha="${RELEASE_SHA_INPUT}"
          else
            release_sha="$(git rev-parse origin/main)"
          fi
          if [ "$(git rev-parse origin/main)" != "${release_sha}" ]; then
            echo "::error::resolved release SHA is not the current origin/main tip"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${release_sha}" ]; then
            echo "::error::resolved release SHA does not match the workflow run head SHA"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

  crates-package:
    name: crates.io package preflight
    needs: verify-source-sha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The verification job proves this immutable workflow SHA is the
          # current main tip. Never feed the dispatch input back into checkout.
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      # Version 0.50.0 has no prebuilt Linux artifact. Cache the audited source
      # build and its dependencies so later runs do not rebuild the tool.
      - name: Cache Rust semver tooling and dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: semver-0.50.0-baseline-0.3.11
          cache-bin: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Checkout Rust semver baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.3.11
          path: .semver-baseline
          persist-credentials: false

      - name: Prepare reproducible Rust semver baseline
        run: node scripts/prepare_semver_baseline.mjs .semver-baseline

      - name: Install cargo-semver-checks
        run: |
          if cargo semver-checks --version 2>/dev/null | grep -Fq 'cargo-semver-checks 0.50.0'; then
            exit 0
          fi
          cargo install cargo-semver-checks --version 0.50.0 --locked

      - name: Check public Rust API semver
        run: node scripts/check_rust_semver.mjs

      - name: Check release version and publish order
        run: node scripts/publish_crates_in_order.mjs order
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify every publishable crate before release
        run: cargo publish --workspace --dry-run --locked

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi
