name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/proto/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "gen/**"
      - "packages/ts/src/proto/generated/**"
      - ".github/workflows/protobuf-ci.yml"
      - "scripts/check_release_readiness.mjs"
      - "scripts/run_pinned_release_readiness.mjs"
      - "scripts/pinned_release_readiness.test.mjs"
      - "scripts/crypto_operation_route_readiness.mjs"
      - "scripts/workflow_gate_policy.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/redact_crypto_proto_debug.mjs"
      - "scripts/generate_error_contract.mjs"
      - "scripts/generate_error_contract.test.mjs"
      - "scripts/generate_contract_constants.mjs"
      - "scripts/generate_contract_constants.test.mjs"
      - "scripts/proto_hardening.test.mjs"
      - "scripts/proto_scalar_policy.mjs"
      - "scripts/proto_scalar_policy.test.mjs"
  push:
    branches:
      - main
    paths:
      - "crates/proto/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "gen/**"
      - "packages/ts/src/proto/generated/**"
      - ".github/workflows/protobuf-ci.yml"
      - "scripts/check_release_readiness.mjs"
      - "scripts/run_pinned_release_readiness.mjs"
      - "scripts/pinned_release_readiness.test.mjs"
      - "scripts/crypto_operation_route_readiness.mjs"
      - "scripts/workflow_gate_policy.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/redact_crypto_proto_debug.mjs"
      - "scripts/generate_error_contract.mjs"
      - "scripts/generate_error_contract.test.mjs"
      - "scripts/generate_contract_constants.mjs"
      - "scripts/generate_contract_constants.test.mjs"
      - "scripts/proto_hardening.test.mjs"
      - "scripts/proto_scalar_policy.mjs"
      - "scripts/proto_scalar_policy.test.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.75.0

jobs:
  protobuf:
    name: lint, immutable contracts, generated freshness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: protobuf-generators
          cache-bin: true

      - name: Install buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
          setup_only: true

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      # The reviewed 0.3.17 schema baseline is pinned by commit so moving a tag
      # cannot weaken compatibility validation for existing generated clients.
      - name: Check protobuf compatibility
        run: buf breaking --against '.git#ref=e57caf7a035c1ffe33aad0038d603b793a69b28a,subdir=crates/proto/proto'

      # The all-feature Rust suite owns immutable selectors and wire goldens.
      # This lane owns reproducible generation, the shared error contract, and
      # committed-byte freshness through one maintenance pipeline.
      - name: Check release readiness generated freshness
        run: node scripts/run_pinned_release_readiness.mjs --generated-freshness
