name: Protobuf Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/proto/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "gen/**"
      - "packages/ts/src/proto/generated/**"
      - ".github/workflows/protobuf-ci.yml"
      - "scripts/check_release_readiness.mjs"
      - "scripts/run_pinned_release_readiness.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/redact_crypto_proto_debug.mjs"
  push:
    branches:
      - main
    paths:
      - "crates/proto/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "crates/proto/**"
      - "gen/**"
      - "packages/ts/src/proto/generated/**"
      - ".github/workflows/protobuf-ci.yml"
      - "scripts/check_release_readiness.mjs"
      - "scripts/run_pinned_release_readiness.mjs"
      - "scripts/release-readiness/core.mjs"
      - "scripts/redact_crypto_proto_debug.mjs"

permissions:
  contents: read

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.73.0

jobs:
  protobuf:
    name: lint, immutable contracts, generated freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Java for release readiness
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TypeScript package dependencies
        run: npm ci --prefix packages/ts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@c61310c7f42caf5b425e349b6742d93ca197327c # wasm-pack
        with:
          tool: wasm-pack@0.15.0

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@c61310c7f42caf5b425e349b6742d93ca197327c # wasm-bindgen-cli
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
          setup_only: true

      - name: Install pinned Buffa generators
        run: |
          cargo install protoc-gen-buffa --version "$BUFFA_VERSION" --locked
          cargo install protoc-gen-buffa-packaging --version "$BUFFA_VERSION" --locked

      # Exact numeric tests and encoded-wire goldens are the immutable selector
      # baseline and run on every protobuf change.
      - name: Check immutable crypto protobuf contracts
        run: |
          set -euo pipefail
          cargo test -p reallyme-crypto-proto --all-features
          for name in contract_tests::protobuf_algorithm_enum_numbers_are_stable contract_tests::every_public_algorithm_has_exactly_one_proto_selector; do
            output="$(cargo test -p crypto-conformance-vectors --test vectors_tests --all-features "$name" -- --exact)"
            printf '%s\n' "$output"
            if ! grep -Fq 'test result: ok. 1 passed; 0 failed;' <<< "$output"; then
              echo "::error::protobuf contract test ${name} did not execute exactly once"
              exit 1
            fi
          done

      - name: Check release readiness generated freshness
        run: node scripts/run_pinned_release_readiness.mjs --generated-freshness
