name: Code Checks

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  tooling:
    name: repository policy and tooling (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
          # Portable tooling uses Intel capacity; compiled Apple lanes below
          # retain ARM64 coverage. Keep logical job names stable for releases.
          - os: macos-15
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject excluded repository files
        run: python3 -B scripts/check_repository_privacy.py --index

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Test repository tooling
        run: node --test --test-concurrency=4 "scripts/**/*.test.mjs" "packages/ts/scripts/*.test.mjs"

      - name: Test Gradle policy tools
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

      - name: Install ShellCheck
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: shellcheck@0.11.0
          fallback: none

      - name: Install actionlint
        run: bash scripts/install_actionlint.sh

      - name: Lint GitHub Actions workflows
        run: actionlint -color

  mobile-targets:
    name: iOS and Android Rust targets
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and mobile targets
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-ios,aarch64-linux-android

      - name: Cache Rust mobile-targets
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mobile-targets

      - name: Check iOS FFI target
        run: cargo check --locked -p crypto-ffi --target aarch64-apple-ios

      - name: Check Android FFI target
        run: cargo check --locked -p crypto-ffi --target aarch64-linux-android

  rust-msrv:
    name: Rust 1.100 minimum version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache Rust rust-msrv
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv-1.100

      # The all-feature tests select the OpenSSL Brainpool provider.
      - name: Build reviewed optional native provider
        env:
          NUM_JOBS: '4'
        run: |
          cargo +1.100.0 run --locked -p optional-provider-build -- --target x86_64-unknown-linux-gnu --out-dir "$PWD/target/optional-provider"
          echo "OPENSSL_DIR=$PWD/target/optional-provider/install" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Check workspace at declared minimum Rust version
        run: cargo +1.100.0 check --locked --workspace --all-features

      - name: Test reallyme-crypto at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto --all-features

      - name: Test reallyme-crypto-aes-kw at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto-aes-kw --all-features

      - name: Test reallyme-crypto-aes256-gcm at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto-aes256-gcm --all-features

      - name: Test reallyme-crypto-aes256-gcm-siv at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto-aes256-gcm-siv --all-features

      - name: Test reallyme-crypto-argon2id at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto-argon2id --all-features

      - name: Test reallyme-crypto-chacha20-poly1305 at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto-chacha20-poly1305 --all-features

      - name: Test reallyme-crypto-concat-kdf at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-crypto-concat-kdf --all-features

      - name: Test reallyme-crypto-constant-time at its declared MSRV
