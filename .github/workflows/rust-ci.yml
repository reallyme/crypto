name: Code Checks

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "formal/**"
      - "!CONTRACT.md"
      - "!PROVIDER_POLICY.md"
      - "!SECURITY_MEMORY_MODEL.md"
      - "!docs/conformance.md"
      - "!docs/protobuf.md"
      - "!docs/rust-publishing.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/renovate.json"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "formal/**"
      - "!CONTRACT.md"
      - "!PROVIDER_POLICY.md"
      - "!SECURITY_MEMORY_MODEL.md"
      - "!docs/conformance.md"
      - "!docs/protobuf.md"
      - "!docs/rust-publishing.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/renovate.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  tooling:
    name: repository policy and tooling (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
          # Portable tooling uses Intel capacity; compiled Apple lanes below
          # retain ARM64 coverage. Keep logical job names stable for releases.
          - os: macos-15
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Test repository tooling
        run: node --test --test-concurrency=4 "scripts/**/*.test.mjs" "packages/ts/scripts/*.test.mjs"

      - name: Test Gradle policy tools
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

      - name: Install ShellCheck
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: shellcheck@0.11.0

      - name: Install actionlint
        run: bash scripts/install_actionlint.sh

      - name: Lint GitHub Actions workflows
        run: actionlint -color

  mobile-targets:
    name: iOS and Android Rust targets
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and mobile targets
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-ios,aarch64-linux-android

      - name: Cache Rust mobile-targets
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mobile-targets

      - name: Check iOS FFI target
        run: cargo check --locked -p crypto-ffi --target aarch64-apple-ios

      - name: Check Android FFI target
        run: cargo check --locked -p crypto-ffi --target aarch64-linux-android

  rust-msrv:
    name: Rust 1.96 minimum version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0

      - name: Cache Rust rust-msrv
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv-1.96

      - name: Check workspace at declared minimum Rust version
        run: cargo check --locked --workspace --all-features

  rust-semver:
    name: Rust public API semver
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Rust semver baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v0.3.11
          path: .semver-baseline

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      # Version 0.50.0 has no prebuilt Linux artifact. Cache the audited source
      # build and its dependencies so later runs do not rebuild the tool.
      - name: Cache Rust semver tooling and dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: semver-0.50.0-baseline-0.3.11
          cache-bin: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Prepare reproducible Rust semver baseline
        run: node scripts/prepare_semver_baseline.mjs .semver-baseline

      - name: Install cargo-semver-checks
        run: |
          if cargo semver-checks --version 2>/dev/null | grep -Fq 'cargo-semver-checks 0.50.0'; then
            exit 0
          fi
          cargo install cargo-semver-checks --version 0.50.0 --locked

      - name: Check public Rust API semver
        run: node scripts/check_rust_semver.mjs

  rust:
    name: fmt, lint, test, wasm, package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The optional Brainpool provider needs the generic EC signing fix in
      # OpenSSL 4.0.3. Build the exact registry-pinned source rather than using
      # the runner's older system library or an implicitly vendored version.
      - name: Build reviewed optional native provider
        env:
          NUM_JOBS: '4'
        run: |
          cargo run --locked -p optional-provider-build -- --target x86_64-unknown-linux-gnu --out-dir "$PWD/target/optional-provider"
          echo "OPENSSL_DIR=$PWD/target/optional-provider/install" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # nextest
        with:
          tool: nextest@0.9.140

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # cargo-audit
        with:
          tool: cargo-audit@0.22.2

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Verify optional native provider isolation
        run: |
          default_tree="$(cargo tree --locked -p reallyme-crypto -e normal,build)"
          if printf '%s\n' "${default_tree}" | grep -E '(^|[^[:alnum:]_])openssl(-sys|-src)?[[:space:]]+v'; then
            echo "Default Rust features selected the optional native provider" >&2
            exit 1
          fi

      - name: Verify OpenMLS HPKE dependency isolation
        run: |
          openmls_tree="$(cargo tree --locked -p reallyme-crypto --no-default-features --features native,hpke-openmls -e normal,build)"
          if printf '%s\n' "${openmls_tree}" | grep -E '(^|[^[:alnum:]_])(p256|p521|k256|x448|reallyme-crypto-secp256k1|reallyme-crypto-x448)[[:space:]]+v'; then
            echo "OpenMLS HPKE feature graph contains an unrelated elliptic-curve dependency" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --check

      - name: Check umbrella crate tarball
        run: cargo package --locked -p reallyme-crypto --list

      - name: Inspect publishable crate tarballs
        run: node scripts/publish_crates_in_order.mjs inspect

      - name: Check narrow Rust feature surfaces
        run: |
          cargo check --locked -p reallyme-crypto-hkdf --no-default-features
          cargo test --locked -p reallyme-crypto-dispatch --test feature_lane_tests --no-default-features
          cargo test --locked -p reallyme-crypto-dispatch --test feature_lane_tests --no-default-features --features native,x25519,ml-kem-768
          cargo test --locked -p reallyme-crypto-signer --no-default-features
          cargo test --locked -p reallyme-crypto-signer --no-default-features --features native
          cargo test --locked -p reallyme-crypto-signer --no-default-features --features native,ed25519
          cargo check --locked -p reallyme-crypto --no-default-features --features native,messaging-primitives
          cargo test --locked -p reallyme-crypto-hpke --no-default-features --features openmls
          cargo check --locked -p reallyme-crypto --no-default-features --features native,hpke-openmls
          cargo test --locked -p reallyme-crypto-hpke --no-default-features --features base-p256-aes128gcm --lib
          cargo test --locked -p reallyme-crypto-rsa --no-default-features --tests
          cargo test --locked -p reallyme-crypto-p256 --no-default-features --test jose_signature_tests --test normalize_signature_tests
          cargo check --locked -p reallyme-crypto --no-default-features --features prime-groups
          cargo test --locked -p reallyme-crypto --no-default-features --features prime-groups,ed448,key-identifier-sha1 --lib --test ecdsa_explicit_tests --test ed448_tests --test key_identifier_tests --test prime_groups

      # SSI and other facade consumers select algorithms without a Rust backend.
      # Every feature must compile independently and as a combined graph.
      - name: Check backendless feature builds
        env:
          RUSTFLAGS: -Dwarnings
        run: bash scripts/check_backendless_features.sh

      - name: Check default JWK multikey EC round trips
        run: cargo test --locked --offline -p reallyme-crypto-jwk-multikey --test p256_roundtrip_tests --test secp256k1_roundtrip_tests

      # Clippy checks compiler warnings and every target under the same feature
      # graph. A separate RUSTFLAGS check duplicates compilation fingerprints.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo nextest run --locked --workspace --no-default-features --features native --test-threads 4

      - name: Test (all features — runs feature-gated tests incl. the proto bridge)
        run: cargo nextest run --locked --workspace --all-features --test-threads 4

      - name: Doc build (enforces missing_docs)
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc

      - name: Verify committed external vectors against public APIs
        run: bash scripts/check_external_vector_adapters.sh

      - name: Check generated provider matrix
        run: node scripts/generate_provider_matrix.mjs --check

      - name: Release readiness
        run: node scripts/run_pinned_release_readiness.mjs --ci-policy

      - name: Dependency policy
        run: cargo deny check

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

  typescript:
    name: typescript package + browser conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            crates/conformance/package-lock.json
            packages/ts/package-lock.json

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Cache TypeScript WASM build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: typescript-wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # wasm-pack
        with:
          tool: wasm-pack@0.15.1

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # wasm-bindgen-cli
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Install TypeScript package dependencies
        run: npm ci --prefix packages/ts

      - name: Verify vectors against TypeScript-native noble oracles
        run: |
          npm ci --prefix crates/conformance
          npm run --prefix crates/conformance verify:ts-native

      - name: Verify post-quantum vectors against @noble/post-quantum oracle
        run: npm run --prefix crates/conformance verify:noble-pq

      - name: Test TypeScript source policy
        run: node scripts/run_pinned_release_readiness.mjs --typescript-source

      - name: Check npm tarball contents and WASM surface
        run: npm --prefix packages/ts run pack:check -- --use-built

      - name: Test TypeScript package in Chromium
        run: node packages/ts/scripts/browser-wasm-test.mjs

      - name: Test primitive WASM backends in Chromium
        run: bash scripts/check_wasm_browser_backends.sh

      - name: Test narrow reader primitives in WASM
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --locked --release -p reallyme-crypto --target wasm32-unknown-unknown --no-default-features --features prime-groups,ed448,key-identifier-sha1 --lib --test ecdsa_explicit_tests --test ed448_tests --test key_identifier_tests --test prime_groups
          cargo test --locked --release -p reallyme-crypto-hpke --target wasm32-unknown-unknown --no-default-features --features base-p256-aes128gcm --lib
          cargo test --locked --release -p reallyme-crypto-rsa --target wasm32-unknown-unknown --no-default-features --features wasm --lib --test representatives --test feature_lane_tests
          cargo test --locked --release -p reallyme-crypto-p256 --target wasm32-unknown-unknown --no-default-features --features wasm --test jose_signature_tests

      - name: Check wasm32 lane
        run: cargo check --locked --workspace --no-default-features --features wasm --target wasm32-unknown-unknown

  native-sanitizers:
    name: native sanitizer lanes
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Cache Rust native-sanitizers
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-sanitizers

      - name: Test FFI with address sanitizer and checked UB
        run: bash scripts/test_native_sanitizers.sh

  ffi-abi-artifact:
    name: FFI release artifact and C sanitizer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Cache Rust ffi-abi-artifact
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-ffi-abi

      - name: Verify release artifact through C sanitizer
        run: bash scripts/test_ffi_abi_release_artifact.sh

      - name: Check conformance-only FFI release profile
        run: cargo check --locked -p crypto-ffi --profile release-ffi --target x86_64-unknown-linux-gnu --features test-vectors

  ffi-miri:
    name: FFI pointer and panic boundary Miri tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Miri toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01
          components: miri

      - name: Cache Rust ffi-miri
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ffi-miri

      - name: Test FFI pointer and panic boundaries
        run: |
          cargo +nightly-2026-07-01 miri test --locked -p crypto-ffi --lib pointer::tests
          cargo +nightly-2026-07-01 miri test --locked -p crypto-ffi --lib guard::tests

  swift:
    name: swift package + vector conformance
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      # The package manifests require Swift tools 6.3. Select the reviewed Xcode
      # before restoring or compiling SwiftPM artifacts.
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Cache Rust swift
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: swift-native
          key: swift-xcode26.6-${{ hashFiles('Package.resolved', 'crates/conformance/platform/swift/Package.resolved') }}
          cache-directories: |
            .build
            crates/conformance/platform/swift/.build

      # The shipped Rust-C-ABI wrapper KATs (ML-KEM/ML-DSA/SLH-DSA/RSA/…) load
      # this dylib at runtime and skip without it. Build it and hand the path
      # to `swift test` so those wrappers are actually exercised against the
      # shared vectors in CI, not silently skipped.
      - name: Build crypto-ffi dylib
        run: cargo build --locked -p crypto-ffi

      - name: Enable source-tree Swift runtime FFI
        run: touch .reallyme-crypto-runtime-ffi

      - name: Check Swift source policy
        run: node scripts/run_pinned_release_readiness.mjs --swift-source
        env:
          REALLYME_CRYPTO_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libcrypto_ffi.dylib
          REALLYME_CRYPTO_SWIFTPM_RUNTIME_FFI: "1"

  kotlin:
    name: kotlin package + vector conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Verify release readiness pins
        run: node scripts/run_pinned_release_readiness.mjs --check-pins

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            packages/kotlin/gradle.lockfile
            packages/kotlin-android/gradle.lockfile
            crates/conformance/platform/kotlin/gradle.lockfile
            packages/kotlin/gradle/verification-metadata.xml
            packages/kotlin-android/gradle/verification-metadata.xml
            crates/conformance/platform/kotlin/gradle/verification-metadata.xml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Cache Rust kotlin
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kotlin-native

      - name: Install pinned Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "ndk;29.0.14206865" <<< "$(printf 'y\n%.0s' {1..32})"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "${GITHUB_ENV}"

      - name: Test Kotlin source policy
        run: node scripts/run_pinned_release_readiness.mjs --kotlin-source
