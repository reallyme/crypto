name: Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "crates/crypto/**"
      - "crates/wasm/**"
      - "crates/concat-kdf/**"
      - "crates/proto/**"
      - "crates/hkdf/**"
      - "crates/hpke/**"
      - "crates/p256/**"
      - "crates/pbkdf2/**"
      - "crates/p384/**"
      - "crates/p521/**"
      - "crates/ml-dsa-*/**"
      - "crates/ml-kem-*/**"
      - "crates/rsa/**"
      - "crates/secp256k1/**"
      - "crates/slh-dsa/**"
      - "crates/jwk/**"
      - "crates/jwk-multikey/**"
      - "fuzz/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "crates/crypto/**"
      - "crates/wasm/**"
      - "crates/concat-kdf/**"
      - "crates/proto/**"
      - "crates/hkdf/**"
      - "crates/hpke/**"
      - "crates/p256/**"
      - "crates/pbkdf2/**"
      - "crates/p384/**"
      - "crates/p521/**"
      - "crates/ml-dsa-*/**"
      - "crates/ml-kem-*/**"
      - "crates/rsa/**"
      - "crates/secp256k1/**"
      - "crates/slh-dsa/**"
      - "crates/jwk/**"
      - "crates/jwk-multikey/**"
      - "fuzz/**"
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build fuzz targets
        run: cargo +nightly-2026-07-01 fuzz build

  scheduled:
    name: scheduled fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - jwk_multikey
          - key_encodings
          - operation_family_boundaries
          - p256_point
          - post_quantum_encodings
          - operation_response
          - rsa_der
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run time-boxed fuzz target
        run: cargo +nightly-2026-07-01 fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
