name: Fuzz

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.build.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-24.04
    outputs:
      verified_sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-19

      - name: Cache fuzz dependencies and tool
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz-nightly-2026-11-19
          workspaces: fuzz -> target
          cache-bin: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # cargo-fuzz can refresh the lockfile, so verify it before the build.
      - name: Verify fuzz lockfile is current
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

      - name: Build fuzz targets
        run: cargo +nightly-2026-11-19 fuzz build
