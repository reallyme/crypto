name: Fuzz

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01

      - name: Cache fuzz dependencies and tool
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz-nightly-2026-07-01
          workspaces: fuzz -> target
          cache-bin: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build fuzz targets
        run: cargo +nightly-2026-07-01 fuzz build

  verified:
    name: Record verified candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build]
    outputs:
      verified_sha: ${{ github.sha }}
    steps:
      - name: Record successful lane
        run: echo "All required jobs verified this candidate"
