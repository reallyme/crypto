name: Formal Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tamarin:
    name: Tamarin HPKE protocol proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install verified Tamarin and Maude releases
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir hpke-verifier
          cd hpke-verifier
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            -o tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sha256sum --check <<'CHECKSUMS'
          201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz
          72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip
          CHECKSUMS
          tar -xzf tamarin.tar.gz
          unzip -q maude.zip
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"

      - name: Verify proof obligations
        timeout-minutes: 8
        env:
          LC_ALL: C.UTF-8
          GHCRTS: "-N2"
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/verify_tamarin.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --

  kani-reference:
    name: kani proofs (reference encoder)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Kani manages its own verification toolchain via `cargo kani setup`.
      # Pin the verifier version deliberately; the proof crate is standalone
      # to keep its dependency-free encoder proof boundary separate from the
      # release workspace and its runtime dependencies.
      - name: Install Kani
        run: |
          cargo install kani-verifier --version '=0.68.0' --locked
          cargo kani setup

      - name: Verify proof obligations
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/verify_reference_encoder_proofs.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --

  kani-verification:
    name: Kani ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope:
          - operation-wire
          - restricted-dispatch
          - plaintext-release
          - hpke-dispatch
          - hpke-state
          - hpke-vectors
          - provider-profiles
          - ml-kem-encoding
          - ml-kem-key-admission
          - x-wing-combiner
          - ecdsa
          - key-agreement
          - x25519-backend
          - aes-key-wrap
          - keccak
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install Kani and its verification toolchain
        if: matrix.scope != 'hpke-vectors'
        run: |
          cargo install kani-verifier --version '=0.68.0' --locked
          cargo kani setup

      # Offline metadata in the dependency proof runners resolves all targets.
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked

      - name: Verify proof obligations
        shell: bash
        working-directory: .
        env:
          FORMAL_SCOPE: ${{ matrix.scope }}
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/verify_formal_scope.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
