name: Formal Verification

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  tamarin:
    name: Tamarin HPKE protocol proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Tamarin and Maude releases
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir hpke-verifier
          cd hpke-verifier
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            -o tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sha256sum --check <<'CHECKSUMS'
          201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz
          72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip
          CHECKSUMS
          tar -xzf tamarin.tar.gz
          unzip -q maude.zip
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"

      - name: Verify proof obligations
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/verify_tamarin.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --

  kani:
    name: kani proofs (reference encoder)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Kani manages its own verification toolchain via `cargo kani setup`.
      # Pin the verifier version deliberately; the proof crate is standalone
      # because Kani 0.67 still bundles a compiler below the release workspace
      # Rust floor.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier@0.67.0
          cargo kani setup

      - name: Verify proof obligations
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --
          bash -e -o pipefail scripts/verify_reference_encoder_proofs.sh
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --exit-code "$GITHUB_SHA" --

  verified:
    name: Record verified candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [tamarin, kani]
    outputs:
      verified_sha: ${{ github.sha }}
    steps:
      - name: Record successful proofs
        run: echo "All proof obligations passed"
