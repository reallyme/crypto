name: Formal Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/aes256-gcm/**"
      - "crates/aes256-gcm-siv/**"
      - "crates/chacha20-poly1305/**"
      - "crates/crypto/core/**"
      - "crates/crypto/dispatch/**"
      - "crates/crypto/src/operation_contract/**"
      - "crates/crypto/src/operations/**"
      - "crates/crypto/tests/restricted_operation_dispatch_tests.rs"
      - "crates/ffi/**"
      - "crates/hpke/**"
      - "crates/proto/**"
      - "crates/wasm/**"
      - "formal/hpke/**"
      - "vectors/external/hpke/rfc9180_test_vectors.json"
      - "vectors/external/provenance.json"
      - "formal/tamarin/**"
      - ".github/workflows/formal-verification.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/aes256-gcm/**"
      - "crates/aes256-gcm-siv/**"
      - "crates/chacha20-poly1305/**"
      - "crates/crypto/core/**"
      - "crates/crypto/dispatch/**"
      - "crates/crypto/src/operation_contract/**"
      - "crates/crypto/src/operations/**"
      - "crates/crypto/tests/restricted_operation_dispatch_tests.rs"
      - "crates/ffi/**"
      - "crates/hpke/**"
      - "crates/proto/**"
      - "crates/wasm/**"
      - "formal/hpke/**"
      - "vectors/external/hpke/rfc9180_test_vectors.json"
      - "vectors/external/provenance.json"
      - "formal/tamarin/**"
      - ".github/workflows/formal-verification.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  tamarin:
    name: Tamarin HPKE protocol proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Tamarin and Maude releases
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir hpke-verifier
          cd hpke-verifier
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            -o tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            -o maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sha256sum --check <<'CHECKSUMS'
          201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz
          72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip
          CHECKSUMS
          tar -xzf tamarin.tar.gz
          unzip -q maude.zip
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"

      - name: Verify secrecy and context binding
        env:
          LC_ALL: C.UTF-8
        run: bash formal/tamarin/verify.sh

  kani:
    name: Kani production boundary proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Install Kani and its verification toolchain
        run: |
          cargo install --locked kani-verifier@0.68.0
          cargo kani setup

      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu

      - name: Prove the ProtoJSON request policy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo kani -p reallyme-crypto-proto --features generated --jobs 2 --output-format terse

      - name: Prove open failures serialize only a protobuf error
        env:
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
          CARGO_NET_OFFLINE: "true"
        run: cargo kani -p reallyme-crypto --features operation-response --lib -Z stubbing --jobs 2 --output-format terse

      - name: Verify restricted operation and provider dispatch
        env:
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo kani -p reallyme-crypto-dispatch --no-default-features --features proto,native,ed25519 --lib -Z stubbing --jobs 2 --output-format terse
          cargo kani -p reallyme-crypto --no-default-features --features operation-response,native,ed25519 --lib -Z stubbing --jobs 2 --output-format terse
          cargo test --locked -p reallyme-crypto --no-default-features --features operation-response,native,ed25519 --test restricted_operation_dispatch_tests

      - name: Prove HPKE dispatch with the full native profile
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo kani -p reallyme-crypto-hpke --no-default-features --features native --jobs 2 --output-format terse

      - name: Prove HPKE dispatch with a restricted profile
        env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          cargo kani -p reallyme-crypto-hpke --no-default-features
          --features base-p256-aes128gcm,aead-export-only --jobs 2 --output-format terse

      - name: Prove the shared AEAD plaintext handoff
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo kani -p reallyme-crypto-core --jobs 2 --output-format terse

      - name: Prove AEAD output preservation at the C ABI and JNI handoff
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo kani -p crypto-ffi --lib -Z stubbing --jobs 2 --output-format terse

      - name: Prove the WASM plaintext handoff
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo kani -p reallyme-crypto-wasm --lib --jobs 2 --output-format terse

      - name: Prove the locked HPKE backend nonce and state transitions
        run: |
          python3 -B formal/hpke/verify_test.py
          python3 formal/hpke/verify.py

      - name: Verify the locked HPKE key schedule and exporter against RFC 9180 vectors
        run: python3 -B formal/hpke/check_schedule_vectors.py

      - name: Verify the resolution still matches the checked-in lockfile
        run: git diff --exit-code -- Cargo.lock
